apiVersion: 1

datasources:
  - name: 'prtg-datasource'
    type: 'srgssr-prtg-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      # Points at this repo's local mock-prtg service (docker-compose.yaml,
      # pkg/mockprtg) so the datasource works out of the box against
      # `npm run server` -- there is no official PRTG container to point at
      # instead. Repoint this at a real PRTG server to test against one.
      serverUrl: 'http://mock-prtg:8080'
      authMode: 'apiKey'
      tlsSkipVerify: false
    secureJsonData:
      apiKey: 'mock-api-key'
