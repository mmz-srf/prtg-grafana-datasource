# Builds and packages the plugin the same way as ci.yml, then runs the full
# Grafana plugin validator (https://github.com/grafana/plugin-validator)
# against the archive and the source code -- the same checks Grafana Labs
# runs when a plugin is submitted to the catalog.
#
# The plugin is only signed when GRAFANA_ACCESS_POLICY_TOKEN and
# GRAFANA_PLUGIN_SIGNING_ROOT_URLS are configured; without them the validator
# reports the archive as unsigned.
name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Plugin validator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      GRAFANA_PLUGIN_SIGNING_ROOT_URLS: ${{ vars.GRAFANA_PLUGIN_SIGNING_ROOT_URLS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Clean copy of the tracked sources (no node_modules/dist) for the
      # source-code analyzers, taken before anything is installed or built.
      - name: Export source code
        run: |
          mkdir -p "${RUNNER_TEMP}/source"
          git archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/source"

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build backend
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Sign plugin
        run: npm run sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' && env.GRAFANA_PLUGIN_SIGNING_ROOT_URLS != '' }}

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(jq -r .id dist/plugin.json | tr -cd 'a-zA-Z0-9._-')
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"

          cp -r dist "${PLUGIN_ID}"
          zip -qr "${ARCHIVE}" "${PLUGIN_ID}"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      # -ghaOutput turns findings into annotations on the run overview, and
      # -output-to-file keeps the full JSON report for the job summary below.
      - name: Run plugin validator
        id: validator
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          mkdir -p "${RUNNER_TEMP}/validator"
          docker run --pull=always \
            -v "${PWD}/${ARCHIVE}:/archive.zip:ro" \
            -v "${RUNNER_TEMP}/source:/source_code:ro" \
            -v "${RUNNER_TEMP}/validator:/output" \
            grafana/plugin-validator-cli \
            -sourceCodeUri file:///source_code \
            -output-to-file /output/report.json \
            -ghaOutput \
            /archive.zip

      # Runs even when the validator fails, so the findings are always visible
      # in the job summary on the run overview.
      - name: Write validator summary
        if: ${{ !cancelled() && steps.validator.outcome != 'skipped' }}
        run: |
          REPORT="${RUNNER_TEMP}/validator/report.json"
          if [ ! -s "${REPORT}" ]; then
            echo "## Plugin validator" >> "$GITHUB_STEP_SUMMARY"
            echo "The validator did not produce a report. Check the job log for details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            def esc: gsub("\\|"; "\\|") | gsub("\r?\n"; "<br>");
            def icon: {"error": "❌", "warning": "⚠️", "suspected": "🔍", "recommendation": "💡", "ok": "✅"}[.] // "•";
            def rank: {"error": 0, "warning": 1, "suspected": 2, "recommendation": 3, "ok": 4}[.] // 5;
            def count($s): map(select(.Severity == $s)) | length;
            def finding: "**" + ((if .Context then .Context + ": " else "" end) + .Title | esc) + "**"
              + (if (.Detail // "") != "" then "<br>" + (.Detail | esc) else "" end);

            [(.["plugin-validator"] // {}) | to_entries[] | .key as $a | .value[] | . + {analyzer: $a}] as $all
            | ($all | map(select(.Severity != "ok")) | sort_by(.Severity | rank)) as $issues
            | ($all | map(select(.Severity == "ok"))) as $passed
            | "## Plugin validator: `\(.id)` \(.version)",
              "",
              "| Severity | Count |",
              "| --- | ---: |",
              (["error", "warning", "suspected", "recommendation", "ok"][] as $s
                | "| \($s | icon) \($s) | \($all | count($s)) |"),
              "",
              (if ($issues | length) == 0 then "No issues found."
               else
                 "### Findings",
                 "",
                 "| | Analyzer | Finding |",
                 "| --- | --- | --- |",
                 ($issues[] | "| \(.Severity | icon) | `\(.analyzer)` | \(finding) |")
               end),
              (if ($passed | length) > 0 then
                 "",
                 "<details><summary>Passed checks (\($passed | length))</summary>",
                 "",
                 "| Analyzer | Check |",
                 "| --- | --- |",
                 ($passed[] | "| `\(.analyzer)` | \(finding) |"),
                 "",
                 "</details>"
               else empty end)
          ' "${REPORT}" >> "$GITHUB_STEP_SUMMARY"
