# Builds the plugin (frontend + backend), packages dist/ into both a .zip
# and a .tar.gz, and attaches both to the GitHub Release for the pushed tag.
#
# Build steps mirror .github/workflows/ci.yml's `build` job (same actions,
# same pinned versions) so release builds behave identically to what's
# already validated on every push/PR.
name: Pre-Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.
  workflow_dispatch: # Allow manual triggering of the workflow from the Actions tab.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build backend
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Sign plugin
        # Uncomment to enable plugin signing: add a GRAFANA_ACCESS_POLICY_TOKEN
        # repository secret. See https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
        run: npm run sign
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install -y jq

          PLUGIN_ID=$(jq -r .id dist/plugin.json)
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          ARCHIVE_BASE="${PLUGIN_ID}-${PLUGIN_VERSION}"

          echo "plugin-id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "plugin-version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive-base=${ARCHIVE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        id: package
        env:
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}
          ARCHIVE_BASE: ${{ steps.metadata.outputs.archive-base }}
        run: |
          mv dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE_BASE}.zip" "${PLUGIN_ID}"
          tar -czf "${ARCHIVE_BASE}.tar.gz" "${PLUGIN_ID}"

          echo "zip-path=${ARCHIVE_BASE}.zip" >> "$GITHUB_OUTPUT"
          echo "tar-path=${ARCHIVE_BASE}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create release and attach archives
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            ${{ steps.package.outputs.zip-path }}
            ${{ steps.package.outputs.tar-path }}
