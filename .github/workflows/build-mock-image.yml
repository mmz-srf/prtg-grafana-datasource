name: Build mock server image

# Builds the standalone mock PRTG APIv2 server (Dockerfile.mockserver) and
# publishes it to GitHub Container Registry, so it can be pulled instead of
# built from source (e.g. in CI or docker-compose).

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Dockerfile.mockserver'
      - 'pkg/mockprtg/**'
      - 'cmd/mockserver/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-mock-image.yml'
#  pull_request:
#    branches:
#      - master
#      - main
#    paths:
#      - 'Dockerfile.mockserver'
#      - 'pkg/mockprtg/**'
#      - 'cmd/mockserver/**'
#      - 'go.sum'
#      - 'go.mod'
#      - '.github/workflows/build-mock-image.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mockserver

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mockserver
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
